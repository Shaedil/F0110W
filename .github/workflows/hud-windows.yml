# Builds the HUD for Windows, so the Windows side is checked without a
# Windows machine. The packaged folder and a drawing of every HUD state
# (--snapshot) are uploaded as artifacts.
name: HUD for Windows

on:
  push:
    paths:
      - Package.swift
      - Sources/**
      - Tests/**
      - build.ps1
      - WindowsUI/**
      - tools/fetch-webview2.ps1
      - .github/workflows/hud-windows.yml
  pull_request:
    paths:
      - Package.swift
      - Sources/**
      - Tests/**
      - build.ps1
      - WindowsUI/**
      - tools/fetch-webview2.ps1
      - .github/workflows/hud-windows.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.2-release
          tag: 6.2-RELEASE

      - name: Fetch the WebView2 SDK
        shell: pwsh
        run: .\tools\fetch-webview2.ps1

      - name: Test the shared code
        run: swift test

      - name: Build and package
        shell: pwsh
        run: .\build.ps1

      - name: Draw every HUD state
        shell: pwsh
        # Piped, so PowerShell waits on a GUI-subsystem program.
        run: .\build\M0110HUD\M0110HUD.exe --snapshot hud-windows.bmp --scale 1.5 | Out-Host

      - name: Try the clipboard
        shell: pwsh
        run: |
          .\build\M0110HUD\M0110HUD.exe --clipboard-probe | Out-Host
          if ($LASTEXITCODE) { throw "clipboard probe failed" }

      - name: Probe without a keyboard
        shell: pwsh
        run: |
          .\build\M0110HUD\M0110HUD.exe --studio-probe | Out-Host
          .\build\M0110HUD\M0110HUD.exe --ble-probe | Out-Host
          exit 0

      - name: Measure memory
        shell: pwsh
        continue-on-error: true
        # The app and every process it starts (WebView2's), as it sits in the
        # tray, with a HUD up, and with the window open. No keyboard here.
        run: |
          function Tree($root) {
            $all = Get-CimInstance Win32_Process
            $ids = @($root); $grew = $true
            while ($grew) {
              $grew = $false
              foreach ($p in $all) {
                if ($ids -contains $p.ParentProcessId -and -not ($ids -contains $p.ProcessId)) { $ids += $p.ProcessId; $grew = $true }
              }
            }
            $ids
          }
          function Sample($label, $extra, $seconds) {
            $params = @{ FilePath = '.\build\M0110HUD\M0110HUD.exe'; PassThru = $true }
            if ($extra) { $params.ArgumentList = $extra }
            $app = Start-Process @params
            Start-Sleep -Seconds $seconds
            $procs = @(Tree $app.Id | ForEach-Object { Get-Process -Id $_ -ErrorAction SilentlyContinue })
            foreach ($q in $procs) {
              "{0,-7} {1,-16} working set {2,6:N1} MB  private {3,6:N1} MB" -f $label, $q.ProcessName, ($q.WorkingSet64 / 1MB), ($q.PrivateMemorySize64 / 1MB)
            }
            "{0,-7} TOTAL            working set {1,6:N1} MB  private {2,6:N1} MB" -f $label, `
              (($procs | Measure-Object WorkingSet64 -Sum).Sum / 1MB), (($procs | Measure-Object PrivateMemorySize64 -Sum).Sum / 1MB)
            $procs | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2
          }
          Sample 'tray' $null 15
          Sample 'popup' @('--test') 2
          Sample 'window' @('--window') 15

      - name: Open the window and screenshot it
        shell: powershell
        run: |
          Add-Type -ReferencedAssemblies System.Drawing -TypeDefinition @"
          using System; using System.Drawing; using System.Runtime.InteropServices;
          public static class Snap {
            [DllImport("user32.dll")] static extern IntPtr GetDC(IntPtr h);
            [DllImport("user32.dll")] static extern int ReleaseDC(IntPtr h, IntPtr dc);
            [DllImport("user32.dll")] static extern int GetSystemMetrics(int i);
            [DllImport("gdi32.dll")] static extern bool BitBlt(IntPtr d, int x, int y, int w, int h, IntPtr s, int sx, int sy, uint rop);
            public static void Save(string path) {
              int w = GetSystemMetrics(0), h = GetSystemMetrics(1);
              using (var bmp = new Bitmap(w, h)) {
                using (var g = Graphics.FromImage(bmp)) {
                  IntPtr d = g.GetHdc(); IntPtr s = GetDC(IntPtr.Zero);
                  BitBlt(d, 0, 0, w, h, s, 0, 0, 0x00CC0020 | 0x40000000);
                  ReleaseDC(IntPtr.Zero, s); g.ReleaseHdc(d);
                }
                bmp.Save(path, System.Drawing.Imaging.ImageFormat.Png);
              }
            }
          }
          "@
          New-Item -ItemType Directory -Force shots | Out-Null
          foreach ($pane in 'keys', 'battery', 'gestures') {
            $env:M0110_WINDOW_PANE = $pane
            $p = Start-Process -FilePath .\build\M0110HUD\M0110HUD.exe -ArgumentList '--window','--verbose' `
                   -RedirectStandardOutput "window-$pane.log" -RedirectStandardError "window-$pane.err" -PassThru
            Start-Sleep -Seconds 10
            [Snap]::Save((Join-Path $PWD "shots\window-$pane.png"))
            Stop-Process -Id $p.Id -Force
            Start-Sleep -Seconds 1
            Get-Content "window-$pane.log", "window-$pane.err"
            Copy-Item "window-$pane.log" shots\
          }

      - name: Record a hang
        shell: pwsh
        run: |
          $env:M0110_HANG_TEST = '4'
          $log = Join-Path $env:LOCALAPPDATA 'M0110HUD\hang.log'
          $p = Start-Process -FilePath .\build\M0110HUD\M0110HUD.exe -PassThru
          # The stall starts two seconds after the app is up, which can take a
          # while on a busy runner: wait for the report rather than a fixed time.
          $deadline = (Get-Date).AddSeconds(30)
          while ((Get-Date) -lt $deadline -and -not ((Test-Path $log) -and (Select-String -Path $log -Pattern 'answered again' -SimpleMatch -Quiet))) {
            Start-Sleep -Milliseconds 500
          }
          "app running: $(-not $p.HasExited)"
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-Content $log
          foreach ($expected in 'not answering for', 'ThreadC5sleep', 'answered again after') {
            if (-not (Select-String -Path $log -Pattern $expected -SimpleMatch -Quiet)) { throw "hang.log lacks '$expected'" }
          }
          Copy-Item $log shots\

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: window-screenshot
          path: shots

      - uses: actions/upload-artifact@v4
        with:
          name: M0110HUD-windows
          path: build/M0110HUD

      - uses: actions/upload-artifact@v4
        with:
          name: hud-windows-snapshot
          path: hud-windows.bmp
