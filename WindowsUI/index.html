<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>M0110</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header id="titlebar">
  <button id="sidebar-toggle" class="sidebar-toggle" title="Hide Sidebar" aria-label="Hide Sidebar"></button>
  <span class="drag"></span>
  <button id="window-minimize" class="caption minimize" title="Minimize" aria-label="Minimize"></button>
  <button id="window-close" class="caption close" title="Close" aria-label="Close"></button>
</header>
<div id="window">
  <aside id="sidebar" class="prism-rim">
    <nav id="panes"></nav>
  </aside>
  <main id="detail">
    <section id="column">
      <header class="pane-header"><span id="title"></span><span id="stripes"></span></header>
      <div id="pane"></div>
    </section>
    <section id="stage-column"></section>
  </main>
</div>
<script>
  // Errors land on the page too, where a preview can read them.
  addEventListener('error', (e) => { document.documentElement.dataset.error = `${e.message} @ ${e.filename}:${e.lineno}`; });
  addEventListener('unhandledrejection', (e) => { document.documentElement.dataset.error = String(e.reason?.stack ?? e.reason); });
</script>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
<script type="module" src="app.js"></script>
</body>
</html>
