description: |
  Apple M0110/M0110A/M0120 keyboard scanner driver.

  These vintage Apple Macintosh keyboards use a 2-wire synchronous serial
  protocol with clock and data lines. The keyboard drives the clock, and
  data is bidirectional.

  Example configuration:

    kscan0: kscan_m0110 {
        compatible = "zmk,kscan-m0110";
        data-gpios = <&gpio0 17 (GPIO_ACTIVE_HIGH | GPIO_PULL_UP)>;
        clock-gpios = <&gpio0 20 (GPIO_ACTIVE_HIGH | GPIO_PULL_UP)>;
        en-gpios = <&gpio0 6 GPIO_ACTIVE_HIGH>;
        idle-timeout-ms = <300000>;
        peek-interval-ms = <5000>;
        rows = <14>;
        columns = <8>;
    };

compatible: "zmk,kscan-m0110"

include: kscan.yaml

properties:
  data-gpios:
    type: phandle-array
    required: true
    description: GPIO connected to the M0110 data line (directly to keyboard)

  clock-gpios:
    type: phandle-array
    required: true
    description: GPIO connected to the M0110 clock line (directly to keyboard)

  poll-period-ms:
    type: int
    default: 5
    description: |
      Deprecated — ignored by the interrupt-driven driver.
      The driver now uses INQUIRY with a clock-line interrupt instead of
      polling, so the CPU sleeps between key events.

  en-gpios:
    type: phandle-array
    description: |
      Optional GPIO connected to the 5V boost converter's EN (enable) pin.
      When specified, the driver disables the boost converter after the idle
      timeout to save power, and periodically re-enables it to check for
      keyboard activity.  The TPS61023 draws only 0.1 µA when disabled.

  idle-timeout-ms:
    type: int
    default: 300000
    description: |
      Milliseconds of inactivity before the driver disables the 5V boost
      converter (requires en-gpios).  Default is 5 minutes.

  peek-interval-ms:
    type: int
    default: 5000
    description: |
      How often (in milliseconds) to briefly re-enable the 5V boost and
      check for keyboard activity while in power-save mode.  The keyboard
      needs ~1 s to boot each time, so very short intervals reduce savings.
      Default is 5 seconds.

  rows:
    type: int
    required: true
    description: |
      Number of rows in the virtual key matrix.
      For M0110A this should be 14 (scancodes 0x00-0x6F mapped as row = scancode >> 3).

  columns:
    type: int
    required: true
    description: |
      Number of columns in the virtual key matrix.
      For M0110A this should be 8 (scancodes mapped as col = scancode & 0x07).
