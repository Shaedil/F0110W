# Diagnostic overlay: build with -DEXTRA_CONF_FILE=../config/m0110-debug.conf
#
# Turns on USB CDC logging and the driver's wire trace, so the bytes the
# keyboard actually sends can be read off a serial console. Not for daily use:
# logging costs flash and adds work to the receive path.

CONFIG_ZMK_USB_LOGGING=y
CONFIG_INPUT_M0110_TRACE=y

# Format the messages off the receive path rather than inside it, so tracing
# perturbs the wire timing as little as possible.
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=4096
