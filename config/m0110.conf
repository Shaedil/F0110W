# M0110 Converter Configuration

# Use minimal libc to avoid SDK compatibility issues
CONFIG_PICOLIBC=n
CONFIG_MINIMAL_LIBC=y

# Provide sprintf via cbprintf (needed by Studio's behavior metadata)
CONFIG_CBPRINTF_LIBC_SUBSTS=y

# Allocate heap for Bluetooth crypto operations
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=8192

# Enable the M0110 kscan driver
CONFIG_KSCAN=y
CONFIG_KSCAN_M0110=y

# Enable both USB and Bluetooth HID output
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y

# Bluetooth device name
CONFIG_ZMK_KEYBOARD_NAME="M0110"

# USB device info
CONFIG_USB_DEVICE_PRODUCT="M0110 Keyboard"
CONFIG_USB_DEVICE_MANUFACTURER="ZMK"

# ZMK Studio support
CONFIG_ZMK_STUDIO=y

# USB serial for Studio RPC transport
CONFIG_USB_CDC_ACM=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
