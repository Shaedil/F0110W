# M0110 Converter Configuration

# Use minimal libc to avoid SDK compatibility issues
CONFIG_PICOLIBC=n
CONFIG_MINIMAL_LIBC=y

# Provide sprintf via cbprintf (needed by Studio's behavior metadata)
CONFIG_CBPRINTF_LIBC_SUBSTS=y

# Allocate heap for Bluetooth crypto operations
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=8192

# Enable the M0110 kscan driver
CONFIG_KSCAN=y
CONFIG_KSCAN_M0110=y

# Enable both USB and Bluetooth HID output
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y

# Bluetooth device name
CONFIG_ZMK_KEYBOARD_NAME="M0110"

# USB device info
CONFIG_USB_DEVICE_PRODUCT="M0110 Keyboard"
CONFIG_USB_DEVICE_MANUFACTURER="ZMK"

# Disable ZMK deep sleep: the M0110 serial protocol requires host-initiated
# polling, so the keyboard cannot wake the nRF from system OFF.  The kscan
# driver's own power-save (boost disable + periodic peek) handles idle power.
CONFIG_ZMK_SLEEP=n

# ZMK Studio support
CONFIG_ZMK_STUDIO=y
# The RPC transmit ring buffer. ZMK defaults to 64 bytes, which the UART
# transport drains fast enough never to notice. Over BLE the same buffer is
# drained one 27-byte indication at a time, each waiting on a confirmation, and
# the encoder stalls part-way through a large reply. Measured: the physical
# layouts response reaches ~1036 bytes and then stops, with no end-of-frame,
# every time. Anything smaller than the largest response is a gamble on drain
# rate; 2048 clears it with room to spare.
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=2048

# USB serial for Studio RPC transport
CONFIG_USB_CDC_ACM=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
